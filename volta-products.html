<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOLT Smart — فئات المنتجات</title>
  <meta name="description" content="جدول فئات منتجات فولتا للأنظمة الذكية والأمنية مع معاينة الصور التفاعلية" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ─── CSS Variables ─── */
    :root {
      --volt-blue: #4571ae;
      --volt-blue-light: #6a96d4;
      --volt-blue-glow: rgba(69, 113, 174, 0.35);
      --bg-base: #050508;
      --bg-surface: #0e0f14;
      --bg-card: #13151d;
      --bg-row: #181b24;
      --bg-row-hover: #1e2233;
      --border: rgba(69, 113, 174, 0.18);
      --border-hover: rgba(69, 113, 174, 0.5);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --radius: 12px;
      --popup-w: 300px;
    }

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Tajawal', 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ─── Grid Background ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(69,113,174,0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(69,113,174,0.07) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(69,113,174,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ─── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ─── Header ─── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--volt-blue), #2a4e8a);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--volt-blue-glow), 0 4px 12px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .logo-wrap svg { width: 28px; height: 28px; fill: white; }

    .header-text h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .header-text h1 span { color: var(--volt-blue-light); }

    .header-text p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .header-badge {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      background: rgba(69,113,174,0.12);
      border: 1px solid rgba(69,113,174,0.3);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--volt-blue-light);
    }

    .header-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
      50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(74,222,128,0); }
    }

    /* ─── Controls Bar ─── */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-wrap svg {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.6rem 2.5rem 0.6rem 1rem;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--volt-blue);
      box-shadow: 0 0 0 3px rgba(69,113,174,0.15);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .count-badge {
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      white-space: nowrap;
    }

    .count-badge strong { color: var(--volt-blue-light); }

    /* ─── Table Wrapper ─── */
    .table-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(69,113,174,0.06);
    }

    /* ─── Table ─── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    /* ─── Table Head ─── */
    thead tr {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 0.85rem 1.1rem;
      text-align: right;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color 0.15s;
    }

    th:hover { color: var(--volt-blue-light); }

    th.sorted { color: var(--volt-blue-light); }

    .th-inner {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sort-icon {
      width: 12px;
      height: 12px;
      opacity: 0.4;
      transition: opacity 0.15s, transform 0.15s;
    }

    th.sorted .sort-icon { opacity: 1; }
    th.sorted.desc .sort-icon { transform: rotate(180deg); }

    /* ─── Table Body ─── */
    tbody tr {
      border-bottom: 1px solid rgba(69,113,174,0.07);
      background: var(--bg-row);
      transition: background 0.15s, box-shadow 0.15s;
      cursor: default;
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover {
      background: var(--bg-row-hover);
      box-shadow: inset 3px 0 0 var(--volt-blue);
    }

    tbody tr.hidden-row { display: none; }

    td {
      padding: 0.9rem 1.1rem;
      vertical-align: middle;
      color: var(--text-secondary);
    }

    /* Number column */
    td.col-num {
      font-family: 'Inter', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 48px;
      text-align: center;
    }

    /* Icon + Name column */
    .product-name-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cat-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .product-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    /* Description column */
    td.col-desc {
      color: var(--text-secondary);
      font-size: 0.83rem;
      max-width: 280px;
    }

    /* Action column */
    td.col-action { width: 80px; text-align: center; }

    .preview-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.38rem 0.85rem;
      background: rgba(69,113,174,0.1);
      border: 1px solid rgba(69,113,174,0.25);
      border-radius: 7px;
      color: var(--volt-blue-light);
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .preview-btn:hover {
      background: rgba(69,113,174,0.22);
      border-color: rgba(69,113,174,0.55);
      transform: scale(1.04);
    }

    .preview-btn svg { width: 13px; height: 13px; }

    /* ─── Empty State ─── */
    .empty-state {
      display: none;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 40px; height: 40px;
      margin: 0 auto 0.75rem;
      opacity: 0.35;
      display: block;
    }

    .empty-state p { font-size: 0.88rem; }

    /* ─── HOVER IMAGE POPUP ─── */
    #img-popup {
      position: fixed;
      z-index: 9999;
      width: var(--popup-w);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    #img-popup.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .popup-inner {
      background: #0d1117;
      border: 1px solid rgba(69,113,174,0.4);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(69,113,174,0.1),
        0 8px 32px rgba(0,0,0,0.7),
        0 0 40px rgba(69,113,174,0.15);
    }

    .popup-img-wrap {
      position: relative;
      width: 100%;
      height: 185px;
      background: #0a0d12;
      overflow: hidden;
    }

    .popup-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
    }

    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    #img-popup.visible .popup-img { transform: scale(1.04); }

    .popup-skeleton {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #1a1e2a 25%, #222739 50%, #1a1e2a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .popup-body {
      padding: 0.9rem 1rem 1rem;
    }

    .popup-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .popup-title .icon { font-size: 1rem; }

    .popup-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    .popup-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--volt-blue-light);
      text-decoration: none;
      transition: color 0.15s;
    }

    .popup-link:hover { color: #fff; }
    .popup-link svg { width: 12px; height: 12px; }

    .popup-volt-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--volt-blue) 0%, #6a96d4 100%);
      border-radius: 0 0 0 0;
    }

    /* ─── Footer ─── */
    .page-footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .page-footer a {
      color: var(--volt-blue-light);
      text-decoration: none;
    }

    .page-footer a:hover { text-decoration: underline; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .header-badge { display: none; }
      td.col-desc { display: none; }
      :root { --popup-w: 250px; }
    }
  </style>
</head>

<body>

  <!-- ════════════ HOVER POPUP ════════════ -->
  <div id="img-popup" role="tooltip" aria-live="polite">
    <div class="popup-inner">
      <div class="popup-volt-bar"></div>
      <div class="popup-img-wrap">
        <div class="popup-skeleton" id="popup-skeleton"></div>
        <img class="popup-img" id="popup-img" src="" alt="" loading="lazy" />
      </div>
      <div class="popup-body">
        <div class="popup-title">
          <span class="icon" id="popup-icon"></span>
          <span id="popup-name"></span>
        </div>
        <div class="popup-desc" id="popup-desc"></div>
        <a class="popup-link" id="popup-link" href="https://volt-smart.com/store" target="_blank" rel="noopener">
          عرض المنتجات
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 17 7M7 7h10v10"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ════════════ MAIN CONTENT ════════════ -->
  <div class="container">

    <!-- Header -->
    <div class="page-header">
      <div class="logo-wrap">
        <!-- VOLT lightning bolt icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.09 12.96a.5.5 0 0 0 .38.84H11l-1 9.16 8.92-10.96a.5.5 0 0 0-.38-.84H13l1-9.16z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>VOLT <span>Smart</span> — فئات المنتجات</h1>
        <p>أنظمة ذكية وحلول أمنية متكاملة · Smart Systems &amp; Security Solutions</p>
      </div>
      <div class="header-badge">
        <span class="dot"></span>
        مصدر حي · volt-smart.com
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          class="search-input"
          id="search-input"
          type="text"
          placeholder="بحث في المنتجات..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="count-badge" id="count-badge">
        <strong id="count-visible">7</strong> من <strong>7</strong> فئة
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="products-table" aria-label="جدول فئات منتجات فولتا">
        <thead>
          <tr>
            <th data-col="num" class="col-num sorted" style="width:48px">
              <span class="th-inner">
                #
                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5 12l7-7 7 7"/>
                </svg>
              </span>
            </th>
            <th data-col="name">
              <span class="th-inner">
                الفئة
                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5 12l7-7 7 7"/>
                </svg>
              </span>
            </th>
            <th data-col="desc" class="col-desc">
              <span class="th-inner">
                الوصف
                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5 12l7-7 7 7"/>
                </svg>
              </span>
            </th>
            <th style="width:90px; text-align:center;">معاينة</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows injected by JS -->
        </tbody>
      </table>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          <path d="M8 11h6M11 8v6"/>
        </svg>
        <p>لا توجد نتائج مطابقة للبحث</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="page-footer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;">
        <path d="M13 2L4.09 12.96a.5.5 0 0 0 .38.84H11l-1 9.16 8.92-10.96a.5.5 0 0 0-.38-.84H13l1-9.16z"/>
      </svg>
      بيانات مستخرجة من
      <a href="https://volt-smart.com/#product-categories" target="_blank" rel="noopener">volt-smart.com</a>
      · الصور عبر Next.js Image Optimization API
    </div>

  </div><!-- /container -->

  <script>
    /* ══════════════════════════════════════════
       VOLT Products Data
       Extracted from volt-smart.com/#product-categories
       Images served via Next.js Image Optimization API
    ══════════════════════════════════════════ */
    const BASE_IMG = 'https://volt-smart.com/landing-page/assets/images/';
    const IMG_PARAMS = '';

    const PRODUCTS = [
      {
        id: 1,
        name: 'Electric & Security Gates',
        nameAr: 'بوابات كهربائية وأمنية',
        desc: 'Advanced entry systems for maximum security',
        descAr: 'أنظمة دخول متطورة لأقصى درجات الأمان',
        img: 'security-gates.png',
        icon: '🔒',
        color: 'rgba(239,68,68,0.15)',
        link: 'https://volt-smart.com/store?category=security-gates'
      },
      {
        id: 2,
        name: 'Smart Locks',
        nameAr: 'أقفال ذكية',
        desc: 'Keyless entry solutions for your property',
        descAr: 'حلول دخول بدون مفاتيح لمنزلك أو مكتبك',
        img: 'smart-locks.png',
        icon: '🔑',
        color: 'rgba(250,204,21,0.15)',
        link: 'https://volt-smart.com/store?category=smart-locks'
      },
      {
        id: 3,
        name: 'CCTV Systems',
        nameAr: 'أنظمة المراقبة CCTV',
        desc: '24/7 monitoring for complete peace of mind',
        descAr: 'مراقبة على مدار الساعة لراحة بال كاملة',
        img: 'cctv-systems.png',
        icon: '📹',
        color: 'rgba(99,102,241,0.15)',
        link: 'https://volt-smart.com/store?category=cctv'
      },
      {
        id: 4,
        name: 'Smart Home',
        nameAr: 'المنزل الذكي',
        desc: 'Automated solutions for modern living',
        descAr: 'حلول أتمتة ذكية للحياة العصرية',
        img: 'smart-home.png',
        icon: '🏠',
        color: 'rgba(69,113,174,0.2)',
        link: 'https://volt-smart.com/store?category=smart-home'
      },
      {
        id: 5,
        name: 'Anti-theft & Fire Warning',
        nameAr: 'أنظمة إنذار السرقة والحريق',
        desc: 'Early detection systems for your safety',
        descAr: 'أنظمة الكشف المبكر لسلامتك وسلامة ممتلكاتك',
        img: 'early-warning.png',
        icon: '🚨',
        color: 'rgba(249,115,22,0.15)',
        link: 'https://volt-smart.com/store?category=alarm'
      },
      {
        id: 6,
        name: 'Fire Fighting Equipment',
        nameAr: 'معدات إطفاء الحريق',
        desc: 'Essential tools for emergency response',
        descAr: 'أدوات أساسية للاستجابة لحالات الطوارئ',
        img: 'fire-fighting.png',
        icon: '🧯',
        color: 'rgba(239,68,68,0.12)',
        link: 'https://volt-smart.com/store?category=fire-fighting'
      },
      {
        id: 7,
        name: 'Sound Systems',
        nameAr: 'أنظمة الصوت',
        desc: 'High-quality audio for any environment',
        descAr: 'صوت عالي الجودة لأي بيئة منزلية أو تجارية',
        img: 'sound-systems.png',
        icon: '🔊',
        color: 'rgba(16,185,129,0.15)',
        link: 'https://volt-smart.com/store?category=sound'
      }
    ];

    /* ══════════════════════════════════════════
       TABLE RENDER
    ══════════════════════════════════════════ */
    const tbody = document.getElementById('table-body');

    function renderRows(data) {
      tbody.innerHTML = '';
      data.forEach((p, idx) => {
        const imgUrl = BASE_IMG + p.img + IMG_PARAMS;
        const tr = document.createElement('tr');
        tr.dataset.id = p.id;
        tr.dataset.name = p.name;
        tr.dataset.desc = p.desc;
        tr.dataset.img = imgUrl;
        tr.dataset.icon = p.icon;
        tr.dataset.link = p.link;
        tr.dataset.nameAr = p.nameAr;
        tr.dataset.descAr = p.descAr;

        tr.innerHTML = `
          <td class="col-num">${idx + 1}</td>
          <td>
            <div class="product-name-cell">
              <div class="cat-icon" style="background:${p.color}">${p.icon}</div>
              <div>
                <div class="product-name">${p.name}</div>
                <div style="font-size:0.72rem;color:var(--text-muted);margin-top:1px">${p.nameAr}</div>
              </div>
            </div>
          </td>
          <td class="col-desc">
            <div>${p.desc}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">${p.descAr}</div>
          </td>
          <td class="col-action">
            <button class="preview-btn" data-row-id="${p.id}" aria-label="معاينة صورة ${p.name}">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              صورة
            </button>
          </td>
        `;

        // Attach hover events to the row
        tr.addEventListener('mouseenter', (e) => showPopup(e, p, imgUrl));
        tr.addEventListener('mousemove', movePopup);
        tr.addEventListener('mouseleave', hidePopup);

        // Button click also triggers popup (for touch / mobile)
        tr.querySelector('.preview-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          showPopupFixed(p, imgUrl, e);
        });

        tbody.appendChild(tr);
      });
    }

    renderRows(PRODUCTS);

    /* ══════════════════════════════════════════
       SEARCH & SORT
    ══════════════════════════════════════════ */
    let sortCol = 'num';
    let sortAsc = true;
    let searchQuery = '';

    function getFiltered() {
      const q = searchQuery.toLowerCase().trim();
      return PRODUCTS.filter(p =>
        !q ||
        p.name.toLowerCase().includes(q) ||
        p.nameAr.includes(q) ||
        p.desc.toLowerCase().includes(q) ||
        p.descAr.includes(q)
      );
    }

    function getSorted(data) {
      return [...data].sort((a, b) => {
        let va, vb;
        if (sortCol === 'num') { va = a.id; vb = b.id; }
        else if (sortCol === 'name') { va = a.name; vb = b.name; }
        else if (sortCol === 'desc') { va = a.desc; vb = b.desc; }
        else { va = a.id; vb = b.id; }
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });
    }

    function refresh() {
      const filtered = getFiltered();
      const sorted = getSorted(filtered);
      renderRows(sorted);
      const countEl = document.getElementById('count-visible');
      countEl.textContent = sorted.length;
      document.getElementById('empty-state').style.display = sorted.length === 0 ? 'block' : 'none';
    }

    // Search
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      refresh();
    });

    // Sort (click on header)
    document.querySelectorAll('th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (col === sortCol) {
          sortAsc = !sortAsc;
          th.classList.toggle('desc', !sortAsc);
        } else {
          document.querySelectorAll('th').forEach(h => h.classList.remove('sorted','desc'));
          sortCol = col;
          sortAsc = true;
        }
        th.classList.add('sorted');
        refresh();
      });
    });

    /* ══════════════════════════════════════════
       POPUP LOGIC
    ══════════════════════════════════════════ */
    const popup = document.getElementById('img-popup');
    const popupImg = document.getElementById('popup-img');
    const popupSkeleton = document.getElementById('popup-skeleton');
    const popupName = document.getElementById('popup-name');
    const popupIcon = document.getElementById('popup-icon');
    const popupDesc = document.getElementById('popup-desc');
    const popupLink = document.getElementById('popup-link');

    const POPUP_W = 300;
    const POPUP_H = 300; // approx
    const OFFSET_X = 20;
    const OFFSET_Y = 16;

    let popupVisible = false;
    let currentImgSrc = '';

    function showPopup(e, product, imgUrl) {
      popupName.textContent = product.name;
      popupIcon.textContent = product.icon;
      popupDesc.textContent = product.desc + ' — ' + product.descAr;
      popupLink.href = product.link;

      // Load image
      if (currentImgSrc !== imgUrl) {
        currentImgSrc = imgUrl;
        popupImg.style.display = 'none';
        popupSkeleton.style.display = 'block';

        const tempImg = new Image();
        tempImg.onload = () => {
          popupImg.src = imgUrl;
          popupImg.alt = product.name;
          popupImg.style.display = 'block';
          popupSkeleton.style.display = 'none';
        };
        tempImg.onerror = () => {
          // Fallback: show skeleton
          popupSkeleton.style.display = 'block';
          popupImg.style.display = 'none';
        };
        tempImg.src = imgUrl;
      }

      positionPopup(e.clientX, e.clientY);
      popup.classList.add('visible');
      popupVisible = true;
    }

    function movePopup(e) {
      if (popupVisible) positionPopup(e.clientX, e.clientY);
    }

    function hidePopup() {
      popup.classList.remove('visible');
      popupVisible = false;
    }

    function positionPopup(cx, cy) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let left = cx + OFFSET_X;
      let top = cy + OFFSET_Y;

      // Flip if too close to right edge
      if (left + POPUP_W + 12 > vw) {
        left = cx - POPUP_W - OFFSET_X;
      }

      // Flip if too close to bottom edge
      if (top + POPUP_H + 12 > vh) {
        top = cy - POPUP_H - OFFSET_Y;
      }

      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    }

    // Fixed popup on button click (for touch)
    function showPopupFixed(product, imgUrl, e) {
      showPopup(e, product, imgUrl);
      // Auto-hide after 3s on click
      setTimeout(hidePopup, 3000);
    }

    /* ══════════════════════════════════════════
       Keyboard accessibility — ESC closes popup
    ══════════════════════════════════════════ */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') hidePopup();
    });
  </script>
</body>
</html>
